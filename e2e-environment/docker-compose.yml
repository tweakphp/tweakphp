services:
  docker-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: tweakphp-e2e-php83:latest
    container_name: tweakphp-docker-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/docker-app:/var/www/html
    ports:
      - "8080:8000"
    command: >
      bash -c "if [ -f artisan ]; then php artisan serve --host=0.0.0.0 --port=8000; else tail -f /dev/null; fi"

  sail-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: tweakphp-e2e-php83:latest
    container_name: tweakphp-sail-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/sail-app:/var/www/html
    ports:
      - "8081:8000"
    command: >
      bash -c "if [ -f artisan ]; then php artisan serve --host=0.0.0.0 --port=8000; else tail -f /dev/null; fi"

  ssh-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: tweakphp-e2e-php83:latest
    container_name: tweakphp-ssh-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/ssh-app:/var/www/html
    ports:
      - "2222:22"
    command: >
      bash -c "mkdir -p /var/run/sshd &&
               ssh-keygen -A &&
               id -u tweakphp >/dev/null 2>&1 || useradd -m -s /bin/bash tweakphp &&
               echo 'tweakphp:secret123' | chpasswd &&
               echo 'root:secret123' | chpasswd &&
               sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
               sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
               chown -R tweakphp:tweakphp /var/www/html &&
               /usr/sbin/sshd -D"
