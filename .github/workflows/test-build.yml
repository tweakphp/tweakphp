name: test-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install NPM Dependencies
        run: npm install

      - name: Install Snapcraft
        if: matrix.os == 'ubuntu-latest'
        run: |
            sudo snap install snapcraft --classic

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build-mac
        env:
          VITE_LSP_WEBSOCKET_PORT: 54331
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SKIP_NOTARIZE: true

      - name: Verify packaged app.asar is not empty
        if: matrix.os == 'macos-latest'
        run: |
          ASAR=$(find release -path '*/TweakPHP.app/Contents/Resources/app.asar' 2>/dev/null | head -1)
          if [ -z "$ASAR" ]; then
            echo "::error::no app.asar found under release/"
            exit 1
          fi
          SIZE=$(stat -c%s "$ASAR" 2>/dev/null || stat -f%z "$ASAR")
          echo "${ASAR}: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::app.asar is only ${SIZE} bytes (empty archive). The app would quit immediately at launch."
            exit 1
          fi

      - name: Verify asar composition (whitelisted node_modules, no dev files)
        if: matrix.os == 'macos-latest'
        run: |
          ASAR=$(find release -path '*/TweakPHP.app/Contents/Resources/app.asar' 2>/dev/null | head -1)
          node -e '
            const asar = require("@electron/asar");
            const files = asar.listPackage(process.argv[1]);
            const nm = new Set(files.filter((f) => f.startsWith("/node_modules/")).map((f) => f.split("/")[2]));
            const allowed = new Set(["intelephense", "better-sqlite3", "bindings", ".bin"]);
            const bad = [...nm].filter((x) => !allowed.has(x));
            if (bad.length) {
              console.error("::error::unexpected node_modules packages in app.asar:", bad.join(", "));
              process.exit(1);
            }
            const junk = files.filter((f) => f.startsWith("/src/") || ["/PKGBUILD", "/.SRCINFO", "/install.sh", "/test-mcp-tools.sh", "/test-mcp-connection.js"].includes(f));
            if (junk.length) {
              console.error("::error::dev-only files packaged in app.asar:", junk.join(", "));
              process.exit(1);
            }
            const required = ["/dist/main.js", "/dist/preload.js", "/package.json", "/migrations"];
            const missing = required.filter((f) => !files.some((x) => x === f || x.startsWith(f + "/")));
            if (missing.length) {
              console.error("::error::required files missing from app.asar:", missing.join(", "));
              process.exit(1);
            }
            console.log("asar composition OK:", [...nm].join(", "));
          ' "$ASAR"

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build-linux
        env:
          VITE_LSP_WEBSOCKET_PORT: 54331
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Build & Publish Windows
        if: matrix.os == 'windows-latest'
        run: npm run build-win
        env:
          VITE_LSP_WEBSOCKET_PORT: 54331
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
